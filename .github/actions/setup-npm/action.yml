name: Setup NPM Packages
description: Setup required NPM packages with caching for pnpm
runs:
  using: composite
  steps:
  - name: Setup Tools
    uses: egose/actions/pnpm-packages@8c912bd1c519dc45e71552fd67e5cd0d82b3ef98
    with:
      frozen: 'true'
      ignore-scripts: 'true'
      paths: |
        .
        website
