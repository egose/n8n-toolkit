name: Setup Tools
description: Setup required tools in the workspace

runs:
  using: composite
  steps:
  - name: Setup Tools
    uses: egose/actions/asdf-tools@8c912bd1c519dc45e71552fd67e5cd0d82b3ef98
    with:
      plugins: |
        picotools=https://github.com/egose/picotools.git

  - name: Install python tools
    run: |
      pip install -r requirements.txt
      asdf reshim
    shell: bash
