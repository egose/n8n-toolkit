name: Test

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Use matrix Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup NPM packages
      uses: ./.github/actions/setup-npm

    - name: Run unit tests
      run: |
        pnpm test

    - name: Typecheck packages
      run: |
        pnpm typecheck

    - name: Verify n8n-sync package artifact
      run: |
        pnpm --filter @egose/n8n-sync build
        pnpm --filter @egose/n8n-sync pack:verify

  n8n-sync-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
        n8n-version: [2.31.2]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Use matrix Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup NPM packages
      uses: ./.github/actions/setup-npm

    - name: Run n8n-sync integration tests
      env:
        N8N_VERSION: ${{ matrix.n8n-version }}
      run: |
        pnpm test:integration
